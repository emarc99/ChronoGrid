<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChronoGrid Rewind</title>
<style>
  :root { --bg:#0b0f17; --panel:#121a27; --ink:#e8eefc; --dim:#8a97b3; --accent:#3ee0b0; --warn:#ffb547; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:transparent; color:var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
  .card { background:var(--panel); border-radius:18px; overflow:hidden; border:1px solid #1f2a3d; }
  .stage { position:relative; aspect-ratio:16/9; background:#05070b; }
  video, .schematic { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .schematic { background:
      linear-gradient(#ffffff08 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, #ffffff08 1px, transparent 1px) 0 0/40px 40px, #070b12; }
  .box { position:absolute; border:3px solid var(--accent); border-radius:8px;
         box-shadow:0 0 0 9999px #00000055, 0 0 24px var(--accent); animation:pulse 1.6s ease-in-out infinite; }
  .box .tag { position:absolute; top:-30px; left:-3px; background:var(--accent); color:#04130e;
              font-weight:700; font-size:14px; padding:3px 10px; border-radius:6px; white-space:nowrap; }
  @keyframes pulse { 50% { box-shadow:0 0 0 9999px #00000055, 0 0 4px var(--accent); } }
  .rec { position:absolute; top:12px; left:14px; font-size:13px; letter-spacing:.12em; color:#ff6b6b; }
  .rec::before { content:"\25CF "; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .meta { padding:16px 20px 6px; }
  .title { font-size:26px; font-weight:700; text-transform:capitalize; }
  .sub { color:var(--dim); font-size:16px; margin-top:4px; }
  .sub b { color:var(--ink); }
  .history { display:flex; gap:8px; padding:12px 20px 18px; overflow-x:auto; scrollbar-width:none; }
  .history::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid #26344d; background:#0e1520; color:var(--dim); border-radius:10px;
          padding:8px 12px; font-size:13px; cursor:pointer; }
  .chip.on { border-color:var(--accent); color:var(--ink); background:#10261f; }
  .chip.removed { border-style:dashed; }
  .empty { padding:40px; text-align:center; color:var(--dim); }
  .hint { color:#5c6884; font-size:12px; padding:0 20px 14px; }
</style>
</head>
<body>
<div class="card" id="root"><div class="empty">Waiting for ChronoGrid&hellip;</div></div>
<script>
(() => {
  const root = document.getElementById("root");
  let data = null, idx = 0, nextId = 1;
  const pending = new Map();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function rpc(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve) => pending.set(id, resolve));
  }
  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  }
  function reportSize() {
    notify("ui/notifications/size-changed", { width: document.body.scrollWidth, height: document.body.scrollHeight });
  }

  function render() {
    if (!data) return;
    if (!data.found) {
      root.innerHTML = `<div class="empty">${esc(data.say || "Not found")}</div>`;
      return reportSize();
    }
    const history = (data.history && data.history.length) ? data.history : [data];
    const cur = history[Math.min(idx, history.length - 1)];
    const [x1, y1, x2, y2] = cur.bbox || [0.4, 0.4, 0.6, 0.6];
    const media = cur.clip_url
      ? `<video src="${esc(cur.clip_url)}" autoplay muted loop playsinline></video>`
      : `<div class="schematic"></div>`;
    const verb = cur.kind === "removed" ? "Picked up from" : (cur.kind === "moved" ? "Moved to" : "Put down in");
    root.innerHTML = `
      <div class="stage">${media}
        <div class="rec">REWIND ${esc(cur.time_text)}</div>
        ${cur.kind === "removed" ? "" : `<div class="box" style="left:${x1*100}%;top:${y1*100}%;width:${(x2-x1)*100}%;height:${(y2-y1)*100}%"><span class="tag">${esc(data.object)}</span></div>`}
      </div>
      <div class="meta">
        <div class="title">${esc(data.object)}</div>
        <div class="sub">${verb} <b>${esc(cur.zone_name)}</b> at <b>${esc(cur.time_text)}</b> &middot; ${esc(cur.ago_text)}</div>
      </div>
      <div class="history">${history.map((h, i) =>
        `<button class="chip ${i === idx ? "on" : ""} ${h.kind === "removed" ? "removed" : ""}" data-i="${i}">
           ${h.kind === "removed" ? "&#8593;" : "&#8595;"} ${esc(h.zone_name)} &middot; ${esc(h.time_text)}</button>`).join("")}</div>
      <div class="hint">&larr; &rarr; step through history</div>`;
    root.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { idx = +b.dataset.i; render(); }));
    reportSize();
  }

  function accept(result) {
    const payload = result && (result.structuredContent || result);
    if (!payload || payload.found === undefined) return;
    data = payload;
    idx = 0;
    render();
  }

  window.addEventListener("message", (ev) => {
    const msg = ev.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      pending.get(msg.id)(msg.result);
      pending.delete(msg.id);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") accept(msg.params);
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" || e.key === "Backspace") {
      notify("ui/notifications/request-teardown", {});
      return;
    }
    if (!data || !data.history) return;
    if (e.key === "ArrowRight") idx = Math.min(idx + 1, data.history.length - 1);
    else if (e.key === "ArrowLeft") idx = Math.max(idx - 1, 0);
    else return;
    render();
  });

  rpc("ui/initialize", {
    appInfo: { name: "chronogrid-rewind", version: "0.1.0" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
    protocolVersion: "2026-01-26",
  }).then(() => notify("ui/notifications/initialized", {}));
})();
</script>
</body>
</html>
